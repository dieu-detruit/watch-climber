<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#132a29" />
    <meta
      name="description"
      content="五竜岳の3D地形に、GPXやWatch Climberの登山記録を重ねて振り返るビューア。記録は端末内で処理します。"
    />
    <title>五竜岳 3D | Watch Climber</title>
  </head>
  <body>
    <div id="app">
      <div id="scene" aria-label="五竜岳周辺の3D地形"></div>
      <header>
        <div class="brand">
          <span class="mountain">△</span> WATCH CLIMBER
          <span class="tag">TRAIL EXPLORER</span>
        </div>
        <div class="heading">
          <div>
            <p class="eyebrow">NORTHERN JAPAN ALPS</p>
            <h1>五竜岳<span>2,814 m</span></h1>
            <p class="sub">歩いた道を、立体で振り返る。</p>
          </div>
          <button id="open" class="primary">＋ 記録を開く</button>
        </div>
      </header>
      <div id="status" role="status">地形データを読み込んでいます…</div>
      <div class="view-tools">
        <button id="home" title="全体表示">全体</button
        ><button id="top">真上</button
        ><button id="zoom-in" aria-label="拡大">＋</button
        ><button id="zoom-out" aria-label="縮小">−</button
        ><button id="north" title="北を上に">N ↑</button>
      </div>
      <div class="settings">
        <label
          >高さ <output id="ex-label">1.0×</output
          ><input
            id="exaggeration"
            aria-label="地形の高さ倍率"
            type="range"
            min="1"
            max="2.5"
            step="0.1"
            value="1" /></label
        ><span id="gesture">1本指で回転 · ピンチで拡大 · 2本指で移動</span>
      </div>
      <section id="panel">
        <div id="empty">
          <span class="eyebrow">YOUR NEXT PERSPECTIVE</span>
          <h2>登山記録を重ねよう</h2>
          <p>
            GPX または Watch Climber の記録JSONを選択。<br />ファイルは端末内だけで処理されます。
          </p>
          <button id="open-empty" class="primary">ファイルを選ぶ ↗</button>
        </div>
        <div id="loaded" hidden>
          <div class="record-heading">
            <div>
              <p id="record-source" class="eyebrow"></p>
              <h2 id="record-name"></h2>
            </div>
            <button id="clear" aria-label="記録を閉じる">×</button>
          </div>
          <div class="stats">
            <div><small>記録距離</small><strong id="distance">—</strong></div>
            <div><small>記録時間</small><strong id="duration">—</strong></div>
            <div><small>獲得標高</small><strong id="ascent">—</strong></div>
          </div>
          <div class="profile-heading">
            <span>記録標高</span><span id="point-label"></span>
          </div>
          <canvas id="profile" aria-label="記録標高の断面図"></canvas
          ><input
            id="position"
            aria-label="記録をたどる"
            type="range"
            min="0"
            max="1"
            value="0"
          />
          <div class="timeline">
            <button id="play">▶ たどる</button><span id="point-time"></span
            ><span id="point-altitude"></span>
          </div>
        </div>
        <div class="panel-footer">
          <span><i></i> 国土地理院 標高データ</span
          ><a
            href="https://maps.gsi.go.jp/development/ichiran.html#dem"
            target="_blank"
            rel="noreferrer"
            >出典 ↗</a
          >
        </div>
      </section>
      <input
        id="file"
        type="file"
        accept=".gpx,.json,application/gpx+xml,application/json"
        hidden
      /><noscript
        >このビューアにはJavaScriptが必要です。Safariなどのブラウザで開いてください。</noscript
      >
    </div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
